name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PaddleOcrNet.sln

      - name: Build (Release)
        run: dotnet build PaddleOcrNet.sln -c Release --no-restore

      - name: Test (unit only — integration tests need model downloads)
        run: dotnet test test/PaddleOcrNet.Tests/PaddleOcrNet.Tests.csproj -c Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
          if-no-files-found: ignore

  aot-smoke:
    name: Native AOT publish and execute (linux-x64)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish source-generated evidence smoke with Native AOT
        run: dotnet publish test/PaddleOcrNet.AotSmoke/PaddleOcrNet.AotSmoke.csproj -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true -o ./artifacts/aot-linux-x64
      - name: Execute native binary
        run: ./artifacts/aot-linux-x64/PaddleOcrNet.AotSmoke
      - name: Retain native smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-linux-x64
          path: ./artifacts/aot-linux-x64
          if-no-files-found: warn

  pack:
    name: Pack (validate nupkg builds)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack library
        run: dotnet pack src/PaddleOcrNet/PaddleOcrNet.csproj -c Release -o ./artifacts
      - name: Pack CUDA companion
        run: dotnet pack src/PaddleOcrNet.Gpu/PaddleOcrNet.Gpu.csproj -c Release -o ./artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
